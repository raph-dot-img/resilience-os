[workspace]
resolver = "3"
members = [
  "crates/resilience-core",
  "crates/resilience-shell",
  "crates/resilience-tui",
  "crates/resilience-gui",
  "crates/resilience-admin",
  "crates/resilience-backup",
  "crates/resilience-library",
  "crates/resilience-crypto",
  "crates/resilience-maps",
  "crates/resilience-install",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "Hippocratic-2.1"
rust-version = "1.89"

[workspace.dependencies]
resilience-core = { path = "crates/resilience-core" }
resilience-shell = { path = "crates/resilience-shell" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
thiserror = "2"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
